/* 404（spec §6.5）：独立静态页，只用内联 CSS 与系统无衬线；不加载 Web 字体、不用衬线；没有框、角饰、标题栏和颗粒 */
:root {
  color-scheme: dark;
  /* 最小令牌：与 packages/ui-theme/src/tokens.css 同名令牌取值一致（not-found-tokens.test.ts 断言） */
  --page: #17130f;
  --bg: #100e0c;
  --surface: #1a1612;
  --ink: #e9e0cd;
  --ink-2: #c0b49d;
  --gold: #dcb877;
  --bronze: #b98a50;
  --focus: #ffd48a;
}
body {
  margin: 0;
  padding: 0 16px;
  background: var(--page);
  color: var(--ink);
  font: 16px/1.8 system-ui, sans-serif;
}
/* 卡片块水平居中；卡内文字一律左对齐（L0） */
main {
  max-width: 600px;
  margin: 15vh auto;
  padding: 24px;
  border: 1px solid var(--bronze);
  border-radius: 4px;
  background: var(--surface);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0;
}
.brand svg {
  flex: none;
  width: 46px;
  height: 24px;
}
h1 {
  color: var(--ink);
  font-size: 28px;
}
p {
  color: var(--ink-2);
}
nav {
  display: flex;
  flex-wrap: wrap;
  column-gap: 24px;
  margin: 8px 0;
}
a {
  display: inline-block;
  padding-block: 10px;
  color: var(--gold);
  text-underline-offset: 4px;
}
a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
</style>
</head>
