<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>页面未找到 · PoE2 Tools</title>
<link rel="icon" href="/favicon.svg" />
<style>
/* 404：独立静态页，只用内联 CSS，不加载脚本、构建产物与 Web 字体。v4 外观：冷蓝黑页面、纯黑直角面板、
   板岩色细线；标题用本机已装的中文衬线（没有时退回系统字体），正文系统无衬线 */
:root {
  color-scheme: dark;
  /* 最小令牌：与 packages/ui-theme/src/tokens.css 同名令牌取值一致（not-found-tokens.test.ts 断言） */
  --page: #0e1115;
  --bg: #000000;
  --line-2: #2c333b;
  --metal-line: #465260;
  --label: #fff8e1;
  --ink: #f2ead8;
  --ink-2: #c9bba0;
  --ink-3: #a38d6d;
  --gold: #e9cf9f;
  --focus: #b8cfff;
}
body {
  margin: 0;
  padding: 0 16px;
  background: var(--page);
  color: var(--ink);
  font: 16px/1.8 system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
}
/* 面板水平居中；面板内文字左对齐 */
main {
  max-width: 600px;
  margin: 15vh auto;
  padding: 32px;
  border: 1px solid var(--line-2);
  border-radius: 0;
  background: var(--bg);
}
.brand {
  margin: 0;
  color: var(--ink-3);
  font-size: 13px;
  letter-spacing: 0.04em;
}
h1 {
  margin: 12px 0 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--metal-line);
  color: var(--label);
  font: 700 28px/1.35 "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", serif;
  letter-spacing: 0.04em;
}
p {
  color: var(--ink-2);
}
nav {
  display: flex;
  flex-wrap: wrap;
  column-gap: 24px;
  margin: 8px 0 0;
}
a {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  color: var(--gold);
  text-underline-offset: 4px;
}
a:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
@media (max-width: 600px) {
  main {
    padding: 24px 16px;
  }
  h1 {
    font-size: 24px;
  }
}
@media (forced-colors: active) {
  main,
  h1 {
    border-color: CanvasText;
  }
}
</style>
</head>
<body>
<main>
<p class="brand">PoE2 Tools · 404</p>
<h1>这里没有找到页面。</h1>
<p>链接可能已经失效，或页面地址已经更改。</p>
<nav aria-label="返回工具"><a href="/">返回首页</a><a href="/build/">打开构筑汉化</a><a href="/extension/">查看中文助手</a></nav>
</main>
</body>
</html>
