<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#17191c" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <title>PoE2 Tools · 少查译名，多研究构筑。</title>
  <meta name="description" content="流放之路 2 中文玩家的工具入口：构筑汉化与 PoE2 中文助手扩展。" />
  <meta property="og:title" content="PoE2 Tools · 少查译名，多研究构筑。" />
  <meta property="og:description" content="流放之路 2 中文玩家的工具入口：构筑汉化与 PoE2 中文助手扩展。" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:url" content="https://poe2-tools.pine2d.com/" />
  <meta name="twitter:card" content="summary" />
  <link rel="canonical" href="https://poe2-tools.pine2d.com/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
      (() => {
        var mode = null
        var saved = null
        try {
          saved = localStorage.getItem('poe2-tools.theme')
          if (saved === 'light' || saved === 'dark') {
            mode = saved
          }
        } catch (_error) {
          mode = null
        }
        if (mode === null) {
          mode =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark'
        }
        document.documentElement.setAttribute('data-theme', mode)
      })()
    </script>
</head>
<body>
  <div id="root"></div>
  <noscript><h1>PoE2 Tools · 少查译名，多研究构筑。</h1><p>流放之路 2 中文玩家的工具入口：构筑汉化与 PoE2 中文助手扩展。</p><p>交互功能需要启用 JavaScript。</p><a href="/build/">构筑汉化</a> · <a href="/extension/">中文助手</a></noscript>
  <script type="module" src="/src/pages/home/main.tsx"></script>
</body>
</html>
