<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoE2 中文助手</title></head>
<body>
<header class="titlebar">
  <span class="pt-motif pt-motif--gem pt-attr-ext titlebar__logo" aria-hidden="true"></span>
  <h1 class="titlebar__title">PoE2 中文助手</h1>
</header>
<main>
  <section aria-labelledby="coe-heading">
  <h2 class="popup-heading" id="coe-heading">CoE 中文显示</h2>
  <div id="page" class="page" data-kind="reading" role="status" aria-live="polite">
    <p class="page__head" hidden><strong class="page__word"></strong><span class="page__reason"></span></p>
    <p class="page__hint">正在读取当前页…</p>
    <button id="reload" class="pt-btn pt-btn--quiet page__action" type="button" hidden>刷新页面</button>
  </div>
  <label class="setting">
    <!-- biome-ignore lint/a11y/useAriaPropsForRole: 原生 checkbox 自带勾选状态，ARIA in HTML 禁止再写 aria-checked -->
    <input type="checkbox" role="switch" class="pt-switch" id="enabled" disabled>
    <span class="setting__text"><span class="setting__label">启用简体中文</span><small>国服术语显示与中文搜索</small></span>
    <span class="pt-switch__state" id="enabled-state" aria-hidden="true">关闭</span>
  </label>
  <label class="setting">
    <!-- biome-ignore lint/a11y/useAriaPropsForRole: 原生 checkbox 自带勾选状态，ARIA in HTML 禁止再写 aria-checked -->
    <input type="checkbox" role="switch" class="pt-switch" id="bilingual" disabled>
    <span class="setting__text"><span class="setting__label">显示中英对照</span><small>保留英文，方便核对术语</small></span>
    <span class="pt-switch__state" id="bilingual-state" aria-hidden="true">关闭</span>
  </label>
  <p id="status" role="status" aria-live="polite" data-tone="idle"></p>
  <button id="retry" class="pt-btn pt-btn--quiet retry" type="button" hidden>重试读取</button>
  </section>
  <div class="pt-divider popup-divider" aria-hidden="true"></div>
  <section aria-labelledby="reading-heading">
  <h2 class="popup-heading" id="reading-heading">网页翻译</h2>
  <button id="translate" class="pt-btn pt-btn--primary translate" type="button" hidden>翻译此页</button>
  <button id="selection" class="pt-btn pt-btn--quiet translate" type="button" hidden>启用本页划词</button>
  <p id="selection-notice" class="guide-notice" role="status" hidden></p>
  <a class="site-settings-link" href="sites.html" target="_blank">管理自动划词站点</a>
  <details id="guide-notice" class="guide-notice" hidden><summary>首次使用说明</summary><p>攻略阅读：点“翻译此页”先预览范围，点击“开始翻译”后才发送所选正文。默认原文旁对照，可切到侧栏或恢复原文；划词可独立使用，选中后点击才发送；整段翻译需要你自备服务 Key。</p></details>
  </section>
</main>
<footer>
  <p><span id="version">版本</span> · <a id="check-update" href="https://poe2-tools.pine2d.com/extension/" target="_blank" rel="noopener noreferrer">检查更新</a></p>
  <p class="pt-disclaimer"><span class="pt-motif pt-motif--gem pt-attr-ext footer__gem" aria-hidden="true"></span>非官方工具，与 Grinding Gear Games、腾讯及 Craft of Exile 无关联，也未获其认可。游戏文本版权归各权利方所有。</p>
</footer>
<script type="module" src="/src/popup/index.ts"></script>
</body>
</html>
