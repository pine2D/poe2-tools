<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PoE2 中文助手</title></head>
<body>
<main>
  <header><h1>PoE2 中文助手</h1><p>Craft of Exile 新版</p></header>
  <label class="setting"><input type="checkbox" id="enabled" disabled><span>启用简体中文<small>国服术语显示与中文搜索</small></span></label>
  <label class="setting"><input type="checkbox" id="bilingual" disabled><span>显示中英对照<small>保留英文，方便核对术语</small></span></label>
  <p id="status" role="status" aria-live="polite">读取设置…</p>
  <button id="retry" type="button" hidden>重试读取</button>
  <aside><strong>使用前</strong><p>原站选择 <b>PoE2</b> 和 <b>English</b>。未匹配的术语保留英文。</p></aside>
  <footer>
    <p id="version">版本</p>
    <p><a id="check-update" href="https://poe2-tools.pine2d.com/extension/" target="_blank" rel="noopener noreferrer">检查更新</a></p>
    <p>非官方工具，与 Grinding Gear Games、腾讯及 Craft of Exile 无关联，也未获其认可。游戏文本版权归各权利方所有。</p>
  </footer>
</main>
<script type="module" src="/src/popup/index.ts"></script>
</body>
</html>
