name: deploy-pages

# 只接收同一工作流中已验证的产物，不重新构建。
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  pages:
    if: vars.CF_PAGES_PROJECT != ''
    runs-on: ubuntu-latest
    concurrency:
      group: pages-${{ inputs.target }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: apps/site/dist
      - name: 上传已验证的网站
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
          DEPLOY_TARGET: ${{ inputs.target }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$DEPLOY_TARGET" = production ]; then
            test "$SOURCE_BRANCH" = main
            deploy_branch=main
          elif [ "$DEPLOY_TARGET" = preview ]; then
            deploy_branch="preview-$SOURCE_BRANCH"
          else
            echo '未知部署目标'
            exit 1
          fi
          set -o pipefail
          pnpm dlx wrangler@4.40.2 pages deploy apps/site/dist --project-name="$PAGES_PROJECT" --branch="$deploy_branch" --commit-hash="$SOURCE_SHA" 2>&1 | tee /tmp/pages-deploy.log
      - name: 验证本次部署的页面与静态资源
        run: |
          node apps/site/scripts/smoke-site.mjs --deployment-log /tmp/pages-deploy.log
