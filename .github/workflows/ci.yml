name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 验证后部署到哪里（生产仅限 main）
        type: choice
        default: none
        options: [none, preview, production]

permissions:
  contents: read

# 同一分支的较新生产检查替代旧检查，避免慢构建稍后覆盖新部署。
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'push' && 'production' || inputs.deploy || 'check' }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      # 同一版本不能换内容（扩展发布 spec §5）：GitHub 上已有该版本的 Release 附件时，必须与 release.json 逐字节一致。
      # 在部署之前拦住误用 EXTENSION_RELEASE_AMEND 改写已发布版本的情况；只读，默认 token 足够。
      - name: 已发布的扩展版本不得换内容
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node apps/poe2-extension/scripts/github-release.mjs guard
      # 打包或闸门失败时留下扩展产物，下载后可与本机逐文件比对（跨环境字节不一致时用）
      - name: 失败时保存扩展产物
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extension-debug-${{ github.sha }}
          path: |
            apps/poe2-extension/dist
            apps/poe2-extension/artifacts
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v7
        with:
          name: site-${{ github.sha }}
          path: apps/site/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: verify
    if: >-
      vars.CF_PAGES_PROJECT != '' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.deploy == 'preview' || (inputs.deploy == 'production' && github.ref == 'refs/heads/main'))))
    uses: ./.github/workflows/deploy.yml
    with:
      target: ${{ github.event_name == 'push' && 'production' || inputs.deploy }}
    secrets: inherit

  # 扩展发布（扩展发布 spec §7）：只在 push 到 main 且本次部署成功后运行；附件取自同一次运行的网站产物。
  # github-release.mjs publish：没有 Release 就创建（不标为 Latest）；已有且附件一致就跳过；缺附件就补传；
  # 草稿、多余附件或内容不一致即失败。整个工作流只有这个 job 有仓库写权限。
  # job 级 concurrency 只保证两个发布不并行；新的 push main 仍会按工作流级 cancel-in-progress 取消整次运行，
  # gh release create 带附件时先建草稿、传完附件才转正式：中途取消留下草稿，下一次运行会失败，需人工检查删除；
  # 已发布 Release 的附件被人工删除时，由下一次运行补传。
  release-extension:
    needs: [verify, deploy]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    concurrency:
      group: release-extension
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          name: site-${{ github.sha }}
          path: site-dist
      - name: 生成发布说明
        id: plan
        run: node apps/poe2-extension/scripts/release-notes.mjs "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
      - name: 创建或核对 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSET: site-dist/downloads/${{ steps.plan.outputs.file }}
          TARGET: ${{ github.sha }}
        run: node apps/poe2-extension/scripts/github-release.mjs publish "$ASSET" "$RUNNER_TEMP/release-notes.md" "$TARGET"

  # 冒烟：GitHub Actions 出口能否访问国服交易站静态端点。词典生成是否能放进 CI 取决于此。
  # 手动触发；不下载、不提交任何数据，只打印状态码与条目数。
  smoke-cn-trade-api:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    steps:
      - name: 请求 poe.game.qq.com trade2 stats
        run: |
          code=$(curl -sS -o /tmp/stats.json -w '%{http_code}' \
            -H 'User-Agent: poe2-tools-ci-smoke (github.com/pine2D/poe2-tools)' \
            'https://poe.game.qq.com/api/trade2/data/stats' || echo 'curl-failed')
          echo "HTTP $code"
          python3 -c "import json;d=json.load(open('/tmp/stats.json'));print('groups', len(d['result']), 'entries', sum(len(g['entries']) for g in d['result']))" || echo '响应不是预期 JSON'
          test "$code" = "200"
